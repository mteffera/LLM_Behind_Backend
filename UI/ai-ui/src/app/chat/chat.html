<div class="chat-container">
  <h2>AI Assistant</h2>

  <!-- Service Status -->
  <div class="status-indicator" *ngIf="serviceStatus !== 'ready'">
    <div class="status-message" [ngClass]="{'error': serviceStatus === 'offline'}">
      <span class="status-icon">{{ serviceStatus === 'checking' ? '🔄' : '❌' }}</span>
      <span>{{ serviceStatus === 'checking' ? 'Checking service...' : 'Service offline - Backend not running' }}</span>
      <button *ngIf="serviceStatus === 'offline'" (click)="retry()" class="retry-btn">Retry</button>
    </div>
  </div>

  <!-- Error Message -->
  <div class="error-message" *ngIf="error">
    <span>⚠️</span> {{ error }}
  </div>

  <!-- Chat Messages -->
  <div class="messages-container" *ngIf="messages.length > 0">
    <div class="message" *ngFor="let message of messages" [ngClass]="{'user-message': message.role === 'user', 'assistant-message': message.role === 'assistant'}">
      <div class="message-header">
        <strong>{{ message.role === 'user' ? 'You' : 'Assistant' }}</strong>
        <small>{{ message.timestamp | date:'shortTime' }}</small>
      </div>
      <div class="message-content">{{ message.content }}</div>
    </div>
  </div>

  <!-- Input Form -->
  <div class="input-section">
    <textarea
      [(ngModel)]="userMessage"
      placeholder="Type your message..."
      rows="3"
      [disabled]="loading || serviceStatus !== 'ready'"
      (keydown.enter)="send()"
      maxlength="1000">
    </textarea>

    <div class="button-group">
      <button (click)="send()" [disabled]="loading || !userMessage.trim() || serviceStatus !== 'ready'">
        {{ loading ? 'Thinking...' : 'Send' }}
      </button>
      <button *ngIf="messages.length > 0" (click)="clearChat()" class="clear-btn" [disabled]="loading">
        Clear Chat
      </button>
    </div>
  </div>
</div>
