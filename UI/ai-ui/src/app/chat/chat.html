<div class="chat-container">

  <h2>AI Assistant</h2>

  <textarea
    [(ngModel)]="userMessage"
    placeholder="Type your message..."
    rows="3">
  </textarea>

  <button (click)="send()" [disabled]="loading">
    {{ loading ? 'Thinking...' : 'Send' }}
  </button>

  <div class="response" *ngIf="assistantMessage">
    <h3>Assistant:</h3>
    <p>{{ assistantMessage }}</p>
  </div>

</div>
